<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mero Planner – Forgot Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/login.css" />
  <style>
    body { background: #1a0a0a; }
    .solo-card {
      width: 420px;
      background: #fffaf3;
      border-radius: 16px;
      padding: 44px 40px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.5);
    }
    .solo-card .logo-row { text-align: center; margin-bottom: 20px; }
    .solo-card .logo-icon {
      width: 52px; height: 52px;
      background: linear-gradient(135deg, #c0392b, #e74c3c);
      border-radius: 14px;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 26px;
      box-shadow: 0 4px 18px rgba(192, 57, 43, 0.45);
    }
    .solo-card h2 { text-align: center; }
    .solo-card .subtitle { text-align: center; margin-bottom: 24px; }
  </style>
</head>
<body>

<div class="solo-card">
  <div class="logo-row"><div class="logo-icon">🔑</div></div>
  <h2>Forgot your password?</h2>
  <p class="subtitle">Enter your email and we'll send you a reset link.</p>

  <div class="alert" id="alert"></div>

  <div class="form-body" id="formBody">
    <div class="field-label">Email Address</div>
    <div class="input-wrap">
      <span class="icon">✉️</span>
      <input type="email" id="email" placeholder="yourname@email.com" />
    </div>

    <button class="btn-login" id="submitBtn" onclick="handleForgotPassword()">Send Reset Link</button>

    <p class="signup-link">Remembered it? <a href="/login">Back to login</a></p>
  </div>
</div>

<script src="/js/forgot-password.js"></script>
</body>
</html>
